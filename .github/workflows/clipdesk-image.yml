name: clipdesk-image

# Builds the clip desk image (server/Dockerfile) and pushes it to GHCR:
#   ghcr.io/<owner>/<repo>/clipdesk:latest and :<sha>

on:
  push:
    branches: [main]
    paths: [scripts/**, skills/**, server/**, requirements.txt, .github/workflows/clipdesk-image.yml]
  workflow_dispatch:

concurrency:
  group: clipdesk-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/clipdesk" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name cd -e CLIPDESK_TOKEN=t -p 8088:8088 ${{ steps.img.outputs.name }}:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS localhost:8088/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8088/runs)" = 401
          docker exec cd ffmpeg -version | head -1
          docker exec cd python -c "import faster_whisper, yt_dlp, cv2; print('deps ok')"
