# GameInsight clip desk on the Hostinger VPS (same host as language-platform).
# .github/workflows/clipdesk-deploy.yml copies this file to ${APP_DIR}/compose.yml and writes the .env next to it.
#
# Entry is the global Traefik of the Hostinger Docker Manager (exposedbydefault=false) – same pattern as
# language-platform. No published ports. If Traefik is NOT on the host network, the deploy workflow detects
# its Docker network and writes a compose.override.yml that joins it (traefik.docker.network label included).
# Router/service are prefixed "gameinsight-" so they cannot collide with routers of other stacks.

name: gameinsight

services:
  clipdesk:
    image: ${IMAGE_REPO}/clipdesk:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      CLIPDESK_TOKEN: ${CLIPDESK_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HOOK_MODEL: ${HOOK_MODEL:-claude-haiku-5-5}
      PUBLIC_URL: https://${DOMAIN}
      RETAIN_DAYS: ${RETAIN_DAYS:-3}
    volumes:
      # clips, reports, run logs, whisper models
      - /srv/gameinsight/data:/data
    # keep the language platform responsive while whisper/ffmpeg work (KVM 4: 4 vCPU, 16 GB)
    cpus: "3"
    mem_limit: 8g
    networks: [internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.gameinsight-clipdesk.rule: Host(`${DOMAIN}`)
      traefik.http.routers.gameinsight-clipdesk.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.gameinsight-clipdesk.tls: "true"
      traefik.http.routers.gameinsight-clipdesk.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.gameinsight-clipdesk.service: gameinsight-clipdesk
      traefik.http.services.gameinsight-clipdesk.loadbalancer.server.port: "8088"

networks:
  internal:
