# GameInsight clip desk on the Hostinger VPS (same host as language-platform).
# .github/workflows/deploy.yml copies this file to ${APP_DIR}/compose.yml and writes the .env next to it.
#
# Entry is the global Traefik of the Hostinger Docker Manager (host network, resolver "letsencrypt",
# exposedbydefault=false) – same pattern as language-platform. No published ports.

name: gameinsight

services:
  clipdesk:
    image: ${IMAGE_REPO}/clipdesk:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      CLIPDESK_TOKEN: ${CLIPDESK_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HOOK_MODEL: ${HOOK_MODEL:-claude-haiku-5-5}
      PUBLIC_URL: https://${DOMAIN}
      RETAIN_DAYS: ${RETAIN_DAYS:-3}
    volumes:
      # clips, reports, run logs, whisper models
      - /srv/gameinsight/data:/data
    # keep the language platform responsive while whisper/ffmpeg work (KVM 4: 4 vCPU, 16 GB)
    cpus: "3"
    mem_limit: 8g
    networks: [internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.clipdesk.rule: Host(`${DOMAIN}`)
      traefik.http.routers.clipdesk.entrypoints: websecure
      traefik.http.routers.clipdesk.tls.certresolver: letsencrypt
      traefik.http.services.clipdesk.loadbalancer.server.port: "8088"

networks:
  internal:
